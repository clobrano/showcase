name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y pv gettext-base

      - name: Lint with shellcheck
        run: shellcheck showcase.sh tests/run.sh

      - name: Run test suite
        run: ./tests/run.sh
